<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Geordi">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E6EC"/>
      <stop offset="45%" stop-color="#A8B0BA"/>
      <stop offset="100%" stop-color="#6B7580"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A7209"/>
      <stop offset="35%" stop-color="#E8C547"/>
      <stop offset="65%" stop-color="#F0D56A"/>
      <stop offset="100%" stop-color="#9A7209"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="24" fill="#121214"/>
  <!-- VISOR: silver bands + gold tines (banana-clip silhouette) -->
  <path
    d="M 26 54 C 42 40 86 40 102 54"
    fill="none"
    stroke="url(#chrome)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M 26 74 C 42 88 86 88 102 74"
    fill="none"
    stroke="url(#chrome)"
    stroke-width="7"
    stroke-linecap="round"
  />
  <g filter="url(#glow)">
    <rect x="34" y="51" width="4" height="26" rx="1.5" fill="url(#gold)"/>
    <rect x="46" y="49" width="4" height="30" rx="1.5" fill="url(#gold)"/>
    <rect x="58" y="47" width="5" height="34" rx="1.5" fill="url(#gold)"/>
    <rect x="71" y="49" width="4" height="30" rx="1.5" fill="url(#gold)"/>
    <rect x="83" y="51" width="4" height="26" rx="1.5" fill="url(#gold)"/>
    <rect x="95" y="53" width="3" height="22" rx="1.5" fill="url(#gold)" opacity="0.85"/>
  </g>
</svg>
