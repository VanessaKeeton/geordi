<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geordi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="./brand-mark.svg" alt="" class="brand-mark" width="48" height="48" />
        <div class="brand-text">
          <h1>Geordi</h1>
          <p class="tagline">See the web as well as anyone</p>
        </div>
      </div>
      <p class="division-badge" aria-label="Operations division">Operations</p>
    </header>

    <main>
      <section aria-labelledby="read-heading">
        <h2 id="read-heading">Read</h2>
        <div class="button-row">
          <button type="button" id="read-page">Read page</button>
          <button type="button" id="read-selection">Read selection</button>
        </div>
      </section>

      <section aria-labelledby="playback-heading">
        <h2 id="playback-heading">Playback</h2>
        <div class="button-row">
          <button type="button" id="play">Play</button>
          <button type="button" id="pause">Pause</button>
          <button type="button" id="stop">Stop</button>
        </div>
      </section>

      <section aria-labelledby="voice-heading">
        <h2 id="voice-heading">Voice settings</h2>
        <fieldset>
          <legend class="visually-hidden">Voice and speed</legend>
          <label for="voice-select">Voice</label>
          <select id="voice-select" name="voice">
            <option value="">System default</option>
          </select>

          <label for="speed-range">
            Speed
            <span id="speed-value" aria-live="polite">1.0×</span>
          </label>
          <input
            type="range"
            id="speed-range"
            name="speed"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
          />
        </fieldset>
      </section>

      <section aria-labelledby="summarize-heading">
        <h2 id="summarize-heading">Summarize</h2>
        <p id="summarize-availability" class="summarize-note"></p>
        <div
          id="summarize-setup"
          class="summarize-setup"
          aria-labelledby="summarize-setup-heading"
          hidden
        >
          <p id="summarize-setup-heading" class="summarize-setup-headline"></p>
          <p id="summarize-setup-detail" class="summarize-setup-detail"></p>
          <ol id="summarize-setup-steps" class="summarize-setup-steps"></ol>
        </div>
        <div class="summarize-controls">
        <fieldset>
          <legend class="visually-hidden">Summary format</legend>
          <label for="summary-format">Format</label>
          <select id="summary-format" name="summaryFormat">
            <option value="paragraph">Concise paragraph</option>
            <option value="bullets">Bullet points</option>
            <option value="takeaways">Key takeaways</option>
          </select>
        </fieldset>
        <div class="button-row">
          <button type="button" id="summarize-page">Summarize page</button>
        </div>
        </div>
        <section
          id="summary-result"
          class="summary-result"
          aria-labelledby="summary-result-heading"
          hidden
        >
          <h3 id="summary-result-heading">Summary</h3>
          <div id="summary-scroll" class="summary-scroll" tabindex="-1">
            <div id="summary-text" class="summary-text"></div>
          </div>
        </section>
      </section>

      <section aria-labelledby="images-heading">
        <h2 id="images-heading">Images</h2>
        <p id="images-availability" class="images-note"></p>
        <div class="images-controls">
          <div class="button-row">
            <button type="button" id="find-page-images">Find images</button>
          </div>
          <fieldset id="image-picker-fieldset" hidden>
            <legend class="visually-hidden">Page images</legend>
            <label for="image-select">Image on page</label>
            <select id="image-select" name="pageImage">
              <option value="">Select an image</option>
            </select>
          </fieldset>
          <div class="button-row">
            <button type="button" id="describe-image" disabled>
              Describe image
            </button>
            <button type="button" id="read-image-description" disabled>
              Read description
            </button>
          </div>
        </div>
        <section
          id="image-description-result"
          class="image-description-result"
          aria-labelledby="image-description-result-heading"
          hidden
        >
          <h3 id="image-description-result-heading">Description</h3>
          <p id="image-description-label" class="image-description-label"></p>
          <div id="image-description-scroll" class="image-description-scroll" tabindex="-1">
            <p id="image-description-text" class="image-description-text"></p>
          </div>
        </section>
      </section>

      <section aria-labelledby="status-heading">
        <h2 id="status-heading">Status</h2>
        <p id="status" role="status" aria-live="polite">Ready.</p>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
